[package]
name = "gitvault"
version = "0.3.0"
edition = "2024"
description = "Git identity interceptor: resolve who may act on a repository, then run the local gates and delegate the audit"
license = "Apache-2.0"
publish = false
default-run = "gitvault"
repository = "https://github.com/Unka-Malloc/gitvault"

[[bin]]
name = "gitvault"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
hmac = "0.13.0"
jiff = "0.2"
libc = "0.2"
rand = "0.10.3"
regex = "1"
serde = { version = "1.0.229", features = ["derive"] }
# preserve_order: policy and record documents keep the operator's file order,
# so a rendered report and its JSON round-trip describe the same sequence.
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.1"
toml = "1.1.6"
ureq = { version = "3", default-features = false, features = ["rustls"] }
