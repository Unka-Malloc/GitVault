# The Pi profile configuration every GitVault audit checker runs on.
#
# Written to <profile>/config.yaml by the installer with the checker's own
# name substituted into the two marked lines. The policy itself is shared:
# a paid semantic review is never cut off by a clock, memory and compression
# stay off so the verdict is formed from evidence alone, and the model gets
# no ambient tool surface beyond what the bridge extension serves.
agent:
  coding_context: "off"
  environment_probe: false
  bot_mode_protocol: false
  turn_liveness:
    timeout_s: 0
tool_loop_guardrails:
  hard_stop_enabled: false
  non_interactive_hard_stop_enabled: false
fallback_model: []
compression:
  enabled: false
memory:
  memory_enabled: false
  user_profile_enabled: false
  nudge_interval: 0
mcp_servers: {}
plugins:
  enabled: [@AGENT@]
platform_toolsets:
  cli: [@AGENT_CLI@]
terminal:
  backend: local
display:
  tool_progress: none
auxiliary:
  title_generation:
    enabled: false
    model_upgrade_enabled: false
  background_review:
    enabled: false
tools:
  tool_search:
    enabled: "off"
